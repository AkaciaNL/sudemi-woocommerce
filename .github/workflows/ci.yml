name: CI
on: [push, pull_request]

jobs:
  lint:
    # The org's own runner on the akacia host (owner 2026-11-09): GitHub-hosted machines cost
    # Actions minutes on this private repository. PHP runs in a php:8.3-cli container (sodium
    # built in); nothing is installed on the host.
    runs-on: [self-hosted, akacia]
    steps:
      - uses: actions/checkout@v4
      # Every file, on the oldest PHP the plugin header claims to support as well as the newest:
      # a syntax that parses on 8.3 and not on 8.0 would break exactly the hosts least able to
      # debug it.
      - name: Lint
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "find . -name '*.php' -print0 | xargs -0 -n1 php -l"
      - name: Signature round-trip
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "php tests/signature-test.php"
      - name: Right-of-withdrawal exclusion
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "php tests/withdrawal-test.php"
      - name: Support tickets
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "php tests/support-test.php"
      - name: Site check (Sudemi-Site, 409 site_mismatch)
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "php tests/site-test.php"
      - name: Return requests
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "php tests/requests-test.php"
      - name: Order safety (accept/reject/shipped answers, price queue)
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "php tests/orders-test.php"
      - name: Currencies (minor units, order and refund currency)
        run: docker run --rm -v "$PWD:/w" -w /w php:8.3-cli sh -c "php tests/currency-test.php"
